version: 1
backend:
  phases:
    build:
      commands:
        - '# Amplify backend function packaging'
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "Packaging static frontend assets for AWS Amplify Hosting..."
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
